name: Build Ba MiFoMa APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      
      - name: Create Full Android Project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "BaMiFoMa"
          include(":app")
          EOF
          
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.2.0" apply false
                    id("org.jetbrains.kotlin.android") version "1.9.10" apply false }
          EOF
          
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.bamifoma.chat"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.bamifoma.chat"
              minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0"
            }
            buildTypes { release { isMinifyEnabled = false } }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            implementation("com.google.android.gms:play-services-nearby:19.0.0")
          }
          EOF
          
          mkdir -p app/src/main/java/com/bamifoma/chat
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || echo '<?xml version="1.0"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="BaMiFoMa"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          mv -f activity_*.xml item_*.xml bg_*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv -f colors.xml strings.xml themes.xml app/src/main/res/values/ 2>/dev/null || true
          
          ls -R
          
      - name: Build APK
        run: |
          cd app
          gradle wrapper --gradle-version 8.4 || true
          chmod +x ../gradlew 2>/dev/null || chmod +x ./gradlew 2>/dev/null || true
          ../gradlew assembleDebug 2>/dev/null || ./gradlew assembleDebug || gradle assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaMiFoMa-APK
          path: "**/build/outputs/apk/debug/*.apk"
