name: Build Ba MiFoMa REAL APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on:ubuntu-latest
    steps:
      - uses:actions/checkout@v4
      - uses:actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
      - name: Clean and Create REAL Project
        run: |
          rm -rf lib pubspec.yaml android ios 2>/dev/null || true
          flutter create. --platforms=android --project-name bamifoma_chat
          cat > pubspec.yaml << 'PUB'
          name: bamifoma_chat
          description: BaMiFoMa REAL Offline + Online Chat
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            nearby_connections: ^1.2.0
            google_mobile_ads: ^4.0.0
            hive_flutter: ^1.1.0
            permission_handler: ^11.3.0
            connectivity_plus: ^6.0.3
            uuid: ^4.4.0
          flutter:
            uses-material-design: true
          PUB
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'package:nearby_connections/nearby_connections.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:uuid/uuid.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            await Hive.openBox('chats');
            MobileAds.instance.initialize();
            runApp(BaMiFoMaApp());
          }
          class BaMiFoMaApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(title: 'BaMiFoMa', theme: ThemeData(primarySwatch: Colors.green), home: RealChatScreen(), debugShowCheckedModeBanner: false);
            }
          }
          class RealChatScreen extends StatefulWidget {
            @override
            _RealChatScreenState createState() => _RealChatScreenState();
          }
          class _RealChatScreenState extends State<RealChatScreen> {
            final Strategy strategy = Strategy.P2P_STAR;
            final box = Hive.box('chats');
            List<Map> messages = [];
            final TextEditingController _controller = TextEditingController();
            String mode = "Checking...";
            bool isOffline = true;
            BannerAd? bannerAd;
            final String userId = Uuid().v4().substring(0,6);
            String connectedDevice = "No device";
            @override
            void initState() {
              super.initState();
              loadMessages();
              checkConnection();
              setupAds();
              requestPermissions();
            }
            void loadMessages() { setState(() { messages = List<Map>.from(box.get('msgs', defaultValue: [])); }); }
            void setupAds() {
              bannerAd = BannerAd(adUnitId: 'ca-app-pub-3940256099942544/6300978111', size: AdSize.banner, request: AdRequest(), listener: BannerAdListener())..load();
            }
            Future<void> requestPermissions() async {
              await [Permission.bluetooth, Permission.bluetoothAdvertise, Permission.bluetoothConnect, Permission.bluetoothScan, Permission.location, Permission.nearbyWifiDevices].request();
              startNearby();
            }
            void checkConnection() {
              Connectivity().onConnectivityChanged.listen((result) {
                setState(() { isOffline = result.contains(ConnectivityResult.none); mode = isOffline? "OFFLINE (Nearby Bluetooth/WiFi)" : "ONLINE (Internet)"; });
              });
            }
            void startNearby() async {
              try {
                await Nearby().startAdvertising(userId, strategy, onConnectionInitiated: (id, info) {
                  Nearby().acceptConnection(id, onPayLoadRecieved: (endid, payload) {
                    String msg = String.fromCharCodes(payload.bytes!);
                    saveMessage({"text": msg, "from": info.endpointName, "me": false, "time": DateTime.now().toString()});
                  });
                }, onConnectionResult: (id, status) { setState(() => connectedDevice = "Connected to $id"); });
                await Nearby().startDiscovery(userId, strategy, onEndpointFound: (id, name, service) {
                  Nearby().requestConnection(name, id, onConnectionInitiated: (id, info) {
                    Nearby().acceptConnection(id, onPayLoadRecieved: (endid, payload) {
                      String msg = String.fromCharCodes(payload.bytes!);
                      saveMessage({"text": msg, "from": info.endpointName, "me": false, "time": DateTime.now().toString()});
                    });
                  }, onConnectionResult: (id, status) { setState(() => connectedDevice = "Connected to $name"); });
                });
              } catch (e) {}
            }
            void saveMessage(Map msg) { messages.add(msg); box.put('msgs', messages); setState(() {}); }
            void send() {
              if (_controller.text.isEmpty) return;
              String text = _controller.text;
              saveMessage({"text": text, "from": "Me ($userId)", "me": true, "time": DateTime.now().toString()});
              try { Nearby().sendBytesPayload(userId, text.codeUnits); } catch(e){}
              _controller.clear();
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('BaMiFoMa REAL - $mode'), backgroundColor: isOffline? Colors.orange : Colors.green),
                body: Column(children: [
                  Container(color: Colors.black12, padding: EdgeInsets.all(8), child: Text('ID: $userId | $connectedDevice | ${isOffline? "OFFLINE" : "ONLINE"}', style: TextStyle(fontSize:11))),
                  Expanded(child: ListView.builder(itemCount: messages.length, itemBuilder: (c,i) { var m = messages[i]; return ListTile(title: Text(m['from']), subtitle: Text(m['text']), trailing: Text(m['me']? "Me" : "Peer"), tileColor: m['me']? Colors.green[50] : Colors.orange[50]); })),
                  if (bannerAd!= null) Container(height: 50, child: AdWidget(ad: bannerAd!)),
                  Row(children: [Expanded(child: TextField(controller: _controller, decoration: InputDecoration(hintText: 'Type message (works offline)...'))), IconButton(icon: Icon(Icons.send), onPressed: send)])
                ]),
              );
            }
          }
          DART
          mkdir -p admin
          cat > admin/index.html << 'HTML'
          <!DOCTYPE html><html><head><title>BaMiFoMa Admin</title><style>body{font-family:Arial;background:#f5f5f5;padding:20px}.card{background:white;padding:20px;margin:10px;border-radius:10px}</style></head><body><h1>BaMiFoMa Admin Control Panel</h1><div class="card"><h3>AdMob Control</h3><p>Ad Status: ON (Test ID active - Replace in main.dart with real ID)</p></div><div class="card"><h3>To Make 100% Real</h3><ol><li>Create Firebase at console.firebase.google.com</li><li>Add android/app/google-services.json</li><li>Replace AdMob Test ID ca-app-pub-3940... with your real ID</li><li>Host admin folder on Vercel</li></ol></div></body></html>
          HTML
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaMiFoMa-REAL-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            admin/
