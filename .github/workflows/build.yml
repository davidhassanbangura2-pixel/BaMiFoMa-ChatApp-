name: Build Ba MiFoMa APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Create Project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="BaMiFoMa"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins{id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.10" apply false}
          EOF
          mkdir -p app/src/main/java/com/bamifoma/chat
          mkdir -p app/src/main/res/layout app/src/main/res/values
          cat > app/build.gradle.kts <<'EOF'
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android")}
          android{
            namespace="com.bamifoma.chat";compileSdk=34
            defaultConfig{applicationId="com.bamifoma.chat";minSdk=24;targetSdk=34;versionCode=1;versionName="1.0"}
            buildTypes{release{isMinifyEnabled=false}}
          }
          dependencies{
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:allowBackup="true" android:label="BaMiFoMa" android:theme="@android:style/Theme.Material.Light">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          </application></manifest>
          EOF
          cat > app/src/main/java/com/bamifoma/chat/MainActivity.kt <<'EOF'
          package com.bamifoma.chat
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity(){
            override fun onCreate(savedInstanceState: Bundle?){
              super.onCreate(savedInstanceState)
              val tv = TextView(this)
              tv.text = "BaMiFoMa Chat - APK Built Successfully! By David"
              tv.textSize = 24f
              tv.setPadding(50,200,50,50)
              setContentView(tv)
            }
          }
          EOF
      - name: Build APK
        run: |
          cd app
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaMiFoMa-APK
          path: app/build/outputs/apk/debug/*.apk
